<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <div id="root">
      <div id="status">Загрузка…</div>
      <button id="btnSignIn" style="display: none">Войти</button>
      <button id="btnLogout" style="display: none">Выйти</button>
    </div>
    <script>
      const FIGMA_ORIGIN = "https://www.figma.com";
      const PLUGIN_ID = "1605922465230974720";

      let token = null;
      const apiBase = window.location.origin;

      const statusEl = document.getElementById("status");
      const btnSignIn = document.getElementById("btnSignIn");
      const btnLogout = document.getElementById("btnLogout");

      function sendTokenToMain(t) {
        token = t;
        updateUI();
        window.parent.postMessage(
          {
            pluginMessage: {
              type: "saveToken",
              token: t,
              pluginId: PLUGIN_ID,
            },
          },
          FIGMA_ORIGIN,
        );
      }

      function updateUI() {
        if (token) {
          statusEl.textContent = "Вы авторизованы.";
          btnSignIn.style.display = "none";
          btnLogout.style.display = "inline-block";
        } else {
          statusEl.textContent = "Войдите через Google.";
          btnSignIn.style.display = "inline-block";
          btnLogout.style.display = "none";
        }
      }

      window.addEventListener("message", (event) => {
        const msg = event.data?.pluginMessage;
        if (!msg) return;
        if (msg.type === "token" && msg.token) {
          token = msg.token;
          updateUI();
        }
      });

      btnSignIn.onclick = async () => {
        statusEl.textContent = "Открытие окна входа…";
        let readKey = null;

        try {
          const res = await fetch(apiBase + "/plugin/keys", { method: "POST" });
          if (!res.ok) throw new Error("Не удалось получить ключи");
          const { readKey: rk, authUrl } = await res.json();
          readKey = rk;
          window.open(authUrl, "_blank");
        } catch (e) {
          statusEl.textContent = "Ошибка: " + (e.message || "сеть");
          updateUI();
          return;
        }

        statusEl.textContent =
          "Ожидание входа… Залогиньтесь в открывшемся окне.";
        const pollInterval = setInterval(async () => {
          try {
            const res = await fetch(
              apiBase + "/auth/poll?readKey=" + encodeURIComponent(readKey),
            );
            if (res.status === 204 || res.status === 404) return;
            if (!res.ok) throw new Error("Ошибка polling");
            const data = await res.json();
            if (data.token) {
              clearInterval(pollInterval);
              sendTokenToMain(data.token);
              statusEl.textContent = "Готово. Можно закрыть окно входа.";
            }
          } catch (e) {
            console.error("poll error", e);
          }
        }, 1500);

        setTimeout(
          () => {
            clearInterval(pollInterval);
            if (!token) {
              statusEl.textContent = "Войдите через Google.";
              updateUI();
            }
          },
          10 * 60 * 1000,
        );
      };

      btnLogout.onclick = () => {
        token = null;
        updateUI();
        window.parent.postMessage(
          {
            pluginMessage: {
              type: "logout",
              pluginId: PLUGIN_ID,
            },
          },
          FIGMA_ORIGIN,
        );
      };

      statusEl.textContent = "Загрузка…";
      setTimeout(() => {
        if (!token) statusEl.textContent = "Войдите через Google.";
        updateUI();
      }, 300);
    </script>
  </body>
</html>
