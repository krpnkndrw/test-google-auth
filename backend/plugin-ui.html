<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <div id="root">
      <div id="status">Загрузка…</div>
      <button id="btnSignIn" style="display: none">Войти</button>
      <button id="btnLogout" style="display: none">Выйти</button>
      <button id="btnMe" style="display: none">Юзер</button>
    </div>
    <script>
      const FIGMA_ORIGIN = "https://www.figma.com";
      const PLUGIN_ID = "1605922465230974720";

      let accessToken = null;
      let refreshToken = null;
      const apiBase = window.location.origin;

      const statusEl = document.getElementById("status");
      const btnSignIn = document.getElementById("btnSignIn");
      const btnLogout = document.getElementById("btnLogout");
      const btnMe = document.getElementById("btnMe");

      function setTokens(at, rt) {
        accessToken = at;
        refreshToken = rt;
        updateUI();
        window.parent.postMessage(
          {
            pluginMessage: {
              type: "saveTokens",
              accessToken: at,
              refreshToken: rt,
              pluginId: PLUGIN_ID,
            },
          },
          process.env.BACKEND_URL,
        );
      }

      function updateUI() {
        if (accessToken) {
          statusEl.textContent = "Вы авторизованы.";
          btnSignIn.style.display = "none";
          btnLogout.style.display = "inline-block";
          btnMe.style.display = "inline-block";
        } else {
          statusEl.textContent = "Войдите через Google.";
          btnSignIn.style.display = "inline-block";
          btnLogout.style.display = "none";
          btnMe.style.display = "none";
        }
      }

      // Получить сохранённые токены от плагина при старте
      window.addEventListener("message", (event) => {
        const msg = event.data?.fromFigma;
        if (!msg) return;
        if (msg.type === "tokens" && msg.accessToken) {
          accessToken = msg.accessToken;
          refreshToken = msg.refreshToken;
          updateUI();
        }
      });

      // Выполнить запрос с автоматическим refresh при 401
      async function fetchWithRefresh(url, options = {}) {
        let res = await fetch(url, {
          ...options,
          headers: {
            ...(options.headers || {}),
            Authorization: `Bearer ${accessToken}`,
          },
        });

        if (res.status === 401 && refreshToken) {
          const refreshRes = await fetch(apiBase + "/auth/refresh", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refreshToken }),
          });

          if (refreshRes.ok) {
            const newTokens = await refreshRes.json();
            setTokens(newTokens.accessToken, newTokens.refreshToken);
            // Повторить оригинальный запрос с новым токеном
            res = await fetch(url, {
              ...options,
              headers: {
                ...(options.headers || {}),
                Authorization: `Bearer ${accessToken}`,
              },
            });
          } else {
            // Refresh token невалиден — выйти
            accessToken = null;
            refreshToken = null;
            updateUI();
          }
        }

        return res;
      }

      btnSignIn.onclick = async () => {
        statusEl.textContent = "Открытие окна входа…";
        let readKey = null;

        try {
          const res = await fetch(apiBase + "/plugin/keys", { method: "POST" });
          if (!res.ok) throw new Error("Не удалось получить ключи");
          const { readKey: rk, authUrl } = await res.json();
          readKey = rk;
          window.open(authUrl, "_blank");
        } catch (e) {
          statusEl.textContent = "Ошибка: " + (e.message || "сеть");
          updateUI();
          return;
        }

        statusEl.textContent =
          "Ожидание входа… Залогиньтесь в открывшемся окне.";
        const pollInterval = setInterval(async () => {
          try {
            const res = await fetch(
              apiBase + "/plugin/poll?readKey=" + encodeURIComponent(readKey),
            );
            if (res.status === 204 || res.status === 404) return;
            if (!res.ok) {
              clearInterval(pollInterval);
              statusEl.textContent = "Ошибка polling.";
              return;
            }
            const data = await res.json();
            if (data.accessToken) {
              clearInterval(pollInterval);
              setTokens(data.accessToken, data.refreshToken);
              statusEl.textContent = "Готово. Можно закрыть окно входа.";
            }
          } catch (e) {
            console.error("poll error", e);
          }
        }, 1500);

        setTimeout(
          () => {
            clearInterval(pollInterval);
            if (!accessToken) {
              statusEl.textContent = "Войдите через Google.";
              updateUI();
            }
          },
          10 * 60 * 1000,
        );
      };

      btnLogout.onclick = async () => {
        if (refreshToken) {
          await fetch(apiBase + "/auth/logout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refreshToken }),
          }).catch(() => {});
        }
        accessToken = null;
        refreshToken = null;
        updateUI();
        window.parent.postMessage(
          {
            pluginMessage: {
              type: "logout",
              pluginId: PLUGIN_ID,
            },
          },
          FIGMA_ORIGIN,
        );
      };

      btnMe.onclick = async () => {
        try {
          const response = await fetchWithRefresh(apiBase + "/plugin/me");
          const data = await response.json();
          statusEl.textContent = "Юзер: " + data.email;
        } catch (e) {
          statusEl.textContent = "Ошибка: " + (e.message || "сеть");
        }
      };

      setTimeout(() => {
        if (!accessToken) statusEl.textContent = "Войдите через Google.";
        updateUI();
      }, 300);
    </script>
  </body>
</html>
